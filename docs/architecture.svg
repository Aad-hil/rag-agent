<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="980" viewBox="0 0 1400 980"><defs><marker id="a" markerWidth="9" markerHeight="9" refX="8" refY="3" orient="auto"><path d="M0 0L9 3L0 6Z" fill="#334155"/></marker><style>.title{font:700 28px Arial;fill:#fff}.h{font:700 18px Arial;fill:#0f172a}.t{font:14px Arial;fill:#334155}.s{font:12px Arial;fill:#475569}.box{stroke:#64748b;stroke-width:2}.flow{stroke:#334155;stroke-width:2.5;fill:none;marker-end:url(#a)}.dash{stroke:#64748b;stroke-width:2;stroke-dasharray:7 5;fill:none;marker-end:url(#a)}</style></defs><rect width="1400" height="980" fill="#f8fafc"/><rect x="20" y="20" width="1360" height="70" rx="12" fill="#164e63"/><text x="45" y="52" class="title">RAG Agent — Detailed Logical Architecture</text><text x="45" y="76" class="s" fill="#dbeafe">Current implementation: FastAPI · LangGraph · Qdrant · PostgreSQL · Ollama/Gemma 3 · LangSmith · Evaluation</text>
<rect x="30" y="115" width="1340" height="90" rx="12" fill="#e0f2fe" class="box"/><text x="55" y="145" class="h">Client Layer</text><rect x="300" y="130" width="300" height="60" rx="9" fill="#fff" class="box"/><text x="325" y="157" class="h">HTTP Client</text><text x="325" y="178" class="t">Swagger UI · curl · Postman</text><rect x="700" y="130" width="300" height="60" rx="9" fill="#fff" class="box"/><text x="725" y="157" class="h">API Contract</text><text x="725" y="178" class="t">POST /query · GET /health</text><path d="M600 160H700" class="flow"/>
<rect x="30" y="230" width="1340" height="115" rx="12" fill="#dcfce7" class="box"/><text x="55" y="260" class="h">Application Layer — FastAPI</text><rect x="300" y="275" width="300" height="55" rx="9" fill="#fff" class="box"/><text x="325" y="308" class="h">Request Validation</text><rect x="700" y="275" width="300" height="55" rx="9" fill="#fff" class="box"/><text x="725" y="308" class="h">Routing · Errors · Logging</text><path d="M850 205V275" class="flow"/><path d="M600 302H700" class="flow"/>
<rect x="30" y="370" width="1340" height="300" rx="12" fill="#ede9fe" class="box"/><text x="55" y="400" class="h">Agent Layer — LangGraph Stateful Workflow</text><text x="55" y="423" class="s">Explicit state · bounded retry · retrieval relevance · grounded generation · validation</text>
<rect x="90" y="455" width="200" height="85" rx="10" fill="#fff" class="box"/><text x="115" y="490" class="h">1. Retrieve</text><text x="115" y="514" class="t">Qdrant top-k search</text><rect x="330" y="455" width="200" height="85" rx="10" fill="#fff" class="box"/><text x="355" y="490" class="h">2. Relevance</text><text x="355" y="514" class="t">Check retrieved context</text><rect x="570" y="455" width="200" height="85" rx="10" fill="#fff" class="box"/><text x="595" y="490" class="h">3. Rewrite</text><text x="595" y="514" class="t">Retry if not relevant</text><rect x="810" y="455" width="200" height="85" rx="10" fill="#fff" class="box"/><text x="835" y="490" class="h">4. Generate</text><text x="835" y="514" class="t">Gemma 3 + context</text><rect x="1050" y="455" width="200" height="85" rx="10" fill="#fff" class="box"/><text x="1075" y="490" class="h">5. Validate</text><text x="1075" y="514" class="t">Answer + citations</text><path d="M290 497H330" class="flow"/><path d="M530 497H570" class="flow"/><path d="M770 497H810" class="flow"/><path d="M1010 497H1050" class="flow"/><path d="M430 540V600H190V540" class="dash"/><text x="205" y="592" class="s">Not relevant → rewrite → retrieve</text><rect x="365" y="575" width="670" height="60" rx="9" fill="#dbeafe" class="box"/><text x="390" y="601" class="h">Agent State</text><text x="390" y="621" class="s">question · rewritten_query · retry_count · results · relevance · answer · validation</text><path d="M850 345V455" class="flow"/>
